<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ song.name }} - 歌曲详情</title>
    <style>
        body {
            margin: 0;
            background: #f5f6fa;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #333;
        }

        header {
            padding: 20px 8%;
            background: white;
            border-bottom: 1px solid #eee;
        }

        header h1 {
            color: #5b5ce2;
        }

        nav a {
            margin-right: 24px;
            color: #666;
            text-decoration: none;
        }

        nav a:hover {
            color: #5b5ce2;
        }

        main {
            width: 84%;
            max-width: 900px;
            margin: 35px auto;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        .search-form select,
        .search-form input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .search-form input {
            flex: 1;
        }

        .search-form button {
            padding: 0 22px;
            border: none;
            border-radius: 5px;
            background: #5b5ce2;
            color: white;
            cursor: pointer;
        }

        .result-list {
            background: white;
            border-radius: 8px;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }

        .result-item img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 6px;
        }

        .result-item a {
            color: #333;
            text-decoration: none;
        }

        .result-item a:hover {
            color: #5b5ce2;
        }

        .pagination {
            margin-top: 25px;
            text-align: center;
        }

        .pagination a,
        .pagination span {
            display: inline-block;
            margin: 4px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            color: #555;
            text-decoration: none;
        }

        .pagination .current {
            background: #5b5ce2;
            color: white;
        }
    </style>
</head>

<body>
<header>
    <h1>音乐网站</h1>

    <nav>
        <a href="{% url 'songs:song_list' %}">歌曲列表</a>
        <a href="{% url 'songs:artists' %}">歌手列表</a>
        <a href="{% url 'songs:search' %}">搜索</a>
    </nav>
</header>

<main>
    {% if song.photo_url %}
    <img class="song-cover" src="{{ song.photo_url }}" alt="{{ song.name }}">
    {% endif %}
    <h2>{{ song.name }}</h2>
    <p>
        歌手：
        <a class="artist-link" href="#">{{ song.artist_name }}</a>
    </p>

    <h3>歌词</h3>
    {% if song.lyric %}
        {% for line in song.lyric %}
            <p>{{ line.lineLyric }}</p>
        {% endfor %}
    {% else %}
        <p>暂无歌词</p>
    {% endif %}

    <a class="back-link" href="{% url 'songs:song_list' %}">
            返回歌曲列表
    </a>
    
</main>
</body>
</html>
